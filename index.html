<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Shop Quận 3</title>
<meta name="theme-color" content="#1f6b4a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6b4a'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EQ3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://jlwayvnokaxiapfaozew.supabase.co">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f6f8f7;--surface:#fff;--subtle:#f2f5f3;--line:#e1e7e3;--line-strong:#cdd6d1;
  --ink:#16261e;--text:#2f3f37;--muted:#5a6a62;--accent:#1f6b4a;--accent-hover:#175a3d;--accent-soft:#e7f1ec;
  --on-accent:#fff;--danger:#b42318;--danger-soft:#fdeceb;--warn:#8a5300;--warn-soft:#fff4e0;--ok:#1f6b4a;
  --r:8px;--shadow:0 1px 2px rgba(16,32,24,.06);--side:232px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:22px;line-height:1.3;font-weight:600;color:var(--ink);letter-spacing:-.2px}
h2{font-size:15px;font-weight:600;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main:focus{outline:none}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:500;white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{background:var(--subtle)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn.ghost:hover{background:var(--subtle)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r);border:0;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--subtle);color:var(--ink)}
.icon-btn.sm{width:28px;height:28px}
.tile form{display:flex;gap:6px;margin:6px 0 2px}
.tile form input{flex:1;min-width:0;height:36px;border:1px solid var(--line-strong);border-radius:var(--r);padding:0 8px;font-variant-numeric:tabular-nums}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
@media (pointer:coarse){.btn,.icon-btn{min-height:44px}.icon-btn,.icon-btn.sm{width:44px;height:44px}.thumbs button{width:44px;height:44px}}

/* Shell */
.shell{min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:var(--s4) var(--s3);z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.logo{width:32px;height:32px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.brand b{display:block;color:var(--ink);font-size:15px}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:var(--r);color:var(--text);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--subtle)}
.nav a[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.nav hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:var(--s3);display:flex;align-items:center;gap:var(--s2);font-size:12px;color:var(--muted);min-width:0}
.side-foot span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.work{margin-left:var(--side);min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--s3);height:56px;padding:0 var(--s5);background:rgba(246,248,247,.96);border-bottom:1px solid var(--line)}
.top .menu{display:none}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow)}
.month .icon-btn{width:34px;height:34px}
.month label{position:relative;min-width:104px;text-align:center;font-weight:600;color:var(--ink);cursor:pointer}
.month input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
main{max-width:1200px;margin:0 auto;padding:var(--s5) var(--s5) 64px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap}
.head p{color:var(--muted);margin-top:4px}
.head .actions{display:flex;gap:var(--s2);flex-wrap:wrap}
.scrim{display:none}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:14px var(--s4);border-bottom:1px solid var(--line)}
.card-b{padding:var(--s4)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin-bottom:var(--s4)}
.tile{padding:var(--s4)}
.tile .lbl{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:var(--s2)}
.tile .val{font-size:24px;font-weight:600;color:var(--ink);margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.3px;white-space:nowrap}
.tile .sub{font-size:12px;color:var(--muted)}
.tile.neg .val{color:var(--danger)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s4)}
.bar{height:8px;background:var(--subtle);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:var(--s3);padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}

/* Table */
.toolbar{display:flex;gap:var(--s2);align-items:center;padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{display:flex;align-items:center;gap:var(--s2);flex:1;min-width:200px;max-width:360px;height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--muted)}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--ink)}
.search:focus-within{outline:2px solid var(--accent);outline-offset:1px}
select.sel{height:36px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:0 10px;max-width:100%}
.toolbar .count{margin-left:auto;font-size:13px;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px var(--s4);background:var(--subtle);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px var(--s4);border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:#fafbfa}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;color:var(--ink);background:var(--subtle);border-top:1px solid var(--line);border-bottom:0}
td .t{color:var(--ink);font-weight:500}
td .d{color:var(--muted);font-size:13px;margin-top:2px}
td.main{min-width:240px}
td.act{width:1%;padding-top:6px;padding-left:4px;padding-right:8px}
.codes{font-size:12.5px;line-height:1.7;white-space:nowrap}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--text)}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:1px 7px;border-radius:5px;border:1px solid var(--line);background:var(--subtle);color:var(--text);white-space:nowrap}
.tag.warn{background:var(--warn-soft);border-color:#f1d9a8;color:var(--warn)}
.tag.ok{background:var(--accent-soft);border-color:#c9e0d4;color:var(--accent)}
.row-actions{display:flex;gap:2px;justify-content:flex-end}
.thumbs{display:flex;gap:4px}
.thumbs button{width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--subtle)}
.thumbs .more{font-size:12px;font-weight:600;color:var(--text)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.empty{padding:40px var(--s4);text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:var(--s3)}
.skel{height:14px;border-radius:4px;background:#e9eeeb;animation:sk 1.2s ease-in-out infinite alternate}
@keyframes sk{from{opacity:1}to{opacity:.45}}
.banner{display:flex;gap:var(--s2);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r);border:1px solid #f3c7c2;background:var(--danger-soft);color:var(--danger);margin-bottom:var(--s4)}
.banner .link{color:var(--danger);margin-left:auto}

/* Dialogs */
dialog{border:0;padding:0;color:var(--text);background:var(--surface);box-shadow:0 12px 48px rgba(16,32,24,.22)}
dialog::backdrop{background:rgba(16,32,24,.42)}
dialog.sheet{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:480px;max-width:100vw;border-left:1px solid var(--line)}
dialog.sheet[open]{animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
dialog.modal{border-radius:12px;width:420px;max-width:calc(100vw - 32px)}
dialog.gallery{background:#111;width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;margin:0}
.sheet form{display:flex;flex-direction:column;height:100%}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3);padding:var(--s4) var(--s5);border-bottom:1px solid var(--line)}
.dh p{color:var(--muted);font-size:13px;margin-top:2px}
.db{padding:var(--s5);overflow-y:auto;flex:1}
.df{display:flex;justify-content:flex-end;gap:var(--s2);padding:var(--s3) var(--s5);border-top:1px solid var(--line);background:var(--surface)}
.field{display:block;margin-bottom:var(--s4)}
.field>span{display:block;font-weight:500;color:var(--ink);margin-bottom:6px;font-size:13px}
.field>span em{color:var(--danger);font-style:normal}
.field input,.field select,.field textarea{width:100%;min-height:38px;border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 10px;background:var(--surface)}
.field textarea{min-height:76px;resize:vertical}
.field small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.field .err{display:block;color:var(--danger);font-size:12px;margin-top:4px}
.field [aria-invalid=true]{border-color:var(--danger)}
.field .filled{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--s3)}
.photos{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:6px}
.photo{position:relative;width:88px;height:88px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--subtle)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong);background:#fff;display:grid;place-items:center;padding:0}
.photo button svg{width:14px;height:14px}
.photo .new{position:absolute;left:0;right:0;bottom:0;font-size:11px;text-align:center;background:rgba(255,255,255,.92)}
.picker{width:88px;height:88px;border:1px dashed var(--line-strong);border-radius:var(--r);display:grid;place-items:center;align-content:center;gap:4px;color:var(--muted);font-size:12px;cursor:pointer;background:var(--surface)}
.picker:focus-within{outline:2px solid var(--accent)}
.picker input{position:absolute;opacity:0;width:1px;height:1px}
.gal{display:flex;flex-direction:column;height:100%;color:#eee}
.gal-top{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4)}
.gal-top span{flex:1;font-size:13px}
.gal-top .icon-btn,.gal-body .icon-btn{color:#eee}
.gal-top .icon-btn:hover,.gal-body .icon-btn:hover{background:#2a2a2a}
.gal-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:var(--s2);padding:0 var(--s2) var(--s4)}
.gal-body img{max-width:calc(100% - 100px);max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-weight:500;z-index:100;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
.check{display:flex;gap:var(--s2);align-items:flex-start;margin:var(--s3) 0}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.inline-form{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
.inline-form input{flex:1;min-width:160px;height:36px;border:1px solid var(--line-strong);border-radius:var(--r);padding:0 10px}

/* Đan vợt */
.sv{max-width:560px}
.sv-sum{padding:var(--s4)}
.sv-sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);margin-bottom:var(--s2)}
.sv-sum-top b{font-size:22px;color:var(--ink)}
.sv-hint{font-size:14px;color:var(--muted);margin-top:var(--s2)}
.sv-hint.ok{color:var(--ok);font-weight:600}
.sv-mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:var(--s4) 0;padding:4px;background:var(--subtle);border:1px solid var(--line);border-radius:12px}
.sv-mode button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:500}
.sv-mode button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.sv-daynav{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.sv-nav{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.sv-nav:disabled{opacity:.35;cursor:not-allowed}
.sv-day{flex:1;text-align:center}
.sv-day b{display:block;font-size:24px;line-height:1.2;color:var(--ink)}
.sv-day span{font-size:14px;color:var(--muted)}
.sv-list{padding:0 var(--s4)}
.sv-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sv-row:last-child{border-bottom:0}
.sv-n{flex:1;min-width:0}
.sv-n b{display:block;font-size:17px;color:var(--ink)}
.sv-n span{font-size:14px;color:var(--muted)}
.sv-row.sun .sv-n b{color:var(--danger)}
.sv-step{width:48px;height:48px;border-radius:12px;border:1px solid var(--line-strong);background:var(--subtle);color:var(--ink);font-size:24px;line-height:1;display:grid;place-items:center;flex-shrink:0;touch-action:manipulation}
.sv-step.plus{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sv-in{width:60px;height:48px;border:1px solid var(--line-strong);border-radius:12px;text-align:center;font-size:22px;font-weight:600;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.sv-in[aria-invalid=true]{border-color:var(--danger)}
.sv-tot{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);color:var(--muted)}
.sv-tot b{color:var(--ink)}
.sv-done{width:100%;min-height:48px;margin-top:var(--s3)}
.sv-h{margin:var(--s5) 0 4px}
.sv-p{font-size:14px;margin:var(--s2) 0}
.sv-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:var(--s2)}
.sv-strip button{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.sv-strip small{font-size:13px;color:var(--muted)}
.sv-strip button.has{background:var(--accent-soft);border-color:transparent}
.sv-strip button.cur{outline:2px solid var(--accent);outline-offset:1px}
.sv-strip button:disabled{opacity:.35;cursor:not-allowed}
.sv-who{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:var(--s2)}
.sv-who button{min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.sv-who small{font-size:13px;color:var(--muted)}
.sv-who button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sv-who button[aria-pressed=true] small{color:var(--on-accent)}
.sv-pay{padding:0 var(--s4)}

/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:var(--s4)}
.auth .card{width:380px;max-width:100%;padding:var(--s6) var(--s5)}
.auth .brand{padding:0 0 var(--s5)}
.auth h1{font-size:20px;margin-bottom:4px}
.auth p{color:var(--muted);margin-bottom:var(--s5)}
.auth .btn{width:100%;min-height:40px}
.form-err{color:var(--danger);background:var(--danger-soft);border:1px solid #f3c7c2;border-radius:var(--r);padding:8px 10px;margin-bottom:var(--s4);font-size:13px}

/* Responsive */
@media (max-width:1023px){
  .side{transform:translateX(-100%);transition:transform .18s;box-shadow:none}
  .side.open{transform:none;box-shadow:12px 0 40px rgba(16,32,24,.18)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(16,32,24,.32);z-index:25}
  .work{margin-left:0}
  .top{padding:0 var(--s4)}
  .top .menu{display:inline-grid}
  main{padding:var(--s4) var(--s4) 64px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:719px){
  .sync .txt{display:none}
  .head{align-items:stretch}
  .head .actions{width:100%}
  .head .actions .btn{flex:1}
  .tile .val{font-size:20px}
  .two{grid-template-columns:1fr}
  .search{max-width:none}
  .toolbar .count{margin-left:0;width:100%}
  /* List rows become stacked cards */
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td,table.stack tfoot{display:block;width:100%}
  table.stack tr{border-bottom:1px solid var(--line);padding:var(--s2) 0}
  table.stack td{border:0;padding:4px var(--s4);display:flex;justify-content:space-between;gap:var(--s3);text-align:right}
  table.stack td::before{content:attr(data-label);color:var(--muted);font-size:13px;text-align:left;flex-shrink:0}
  table.stack td.main{display:block;text-align:left}
  table.stack td.main::before{display:none}
  table.stack td .thumbs,table.stack td .row-actions{justify-content:flex-end}
  table.stack td.act{width:100%}
  table.stack td.act::before{display:none}
  table.stack tfoot tr{padding:0}
  table.stack tfoot td{padding:12px var(--s4)}
  .dh,.db,.df{padding-left:var(--s4);padding-right:var(--s4)}
  .gal-body img{max-width:calc(100% - 80px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
<dialog class="modal" id="modal" aria-labelledby="modal-title"></dialog>
<dialog class="gallery" id="gallery" aria-label="Ảnh bằng chứng"></dialog>

<script id="xlsx-builder">
/* Pure workbook builder: buildWorkbook(ExcelJS, d) — d = {month, today, settings, budget, expenses, strings, deposits, images?} */
function buildWorkbook(ExcelJS, d) {
  const EXP_CATS = ['Chi theo đơn hàng', 'Mua dụng cụ', 'Hỗ trợ tiền xăng', 'Chi nội bộ khác', 'Chưa phân loại'];
  const INTERNAL = ['Mua dụng cụ', 'Hỗ trợ tiền xăng', 'Chi nội bộ khác'];
  const catOf = e => EXP_CATS.includes(e.category) ? e.category : 'Chưa phân loại';
  const [yy, mm] = d.month.split('-');
  const title = `SHOP QUẬN 3 · BÁO CÁO THÁNG ${mm}/${yy}`;
  const dmy = s => s ? s.split('-').reverse().join('/') : '';
  const serial = s => { const [y, m, dd] = s.split('-').map(Number); return 25569 + Date.UTC(y, m - 1, dd) / 86400000; };
  const sub = `Xuất ngày ${dmy(d.today)}`;
  const C = { ink: 'FF16261E', muted: 'FF5A6A62', accent: 'FF1F6B4A', zebra: 'FFF5F8F6', line: 'FFD3DCD7', total: 'FFE7F1EC', warn: 'FFFFF4E0', warnInk: 'FF8A5300', neg: 'FFB42318' };
  const MONEY = '#,##0" đ";[Red]-#,##0" đ"', INT = '#,##0', DATE = 'dd/mm/yyyy';
  const thin = { style: 'thin', color: { argb: C.line } };
  const BORDER = { top: thin, left: thin, bottom: thin, right: thin };
  const F = (o = {}) => ({ name: 'Arial', size: 10, color: { argb: C.ink }, ...o });
  const fill = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
  const q = name => `'${name.replace(/'/g, "''")}'`;
  const col = n => { let s = ''; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };
  const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Sổ Shop Quận 3';
  wb.created = new Date();
  wb.calcProperties = { fullCalcOnLoad: true };

  function sheet(name, widths, landscape, headerRow, xSplit = 0) {
    const ws = wb.addWorksheet(name, { properties: { defaultRowHeight: 18 } });
    ws.columns = widths.map(w => ({ width: w }));
    ws.views = [headerRow || xSplit ? { state: 'frozen', ySplit: headerRow, xSplit, showGridLines: false } : { showGridLines: false }];
    ws.pageSetup = { paperSize: 9, orientation: landscape ? 'landscape' : 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, horizontalCentered: true,
      margins: { left: 0.4, right: 0.4, top: 0.55, bottom: 0.55, header: 0.3, footer: 0.3 } };
    if (headerRow) ws.pageSetup.printTitlesRow = `${headerRow}:${headerRow}`;
    ws.headerFooter = { oddFooter: `&L&8${title}&R&8Trang &P / &N` };
    const last = widths.length;
    ws.mergeCells(1, 1, 1, last);
    Object.assign(ws.getCell(1, 1), { value: title, font: F({ size: 14, bold: true, color: { argb: C.accent } }), alignment: { vertical: 'middle' } });
    ws.getRow(1).height = 26;
    ws.mergeCells(2, 1, 2, last);
    Object.assign(ws.getCell(2, 1), { value: sub, font: F({ color: { argb: C.muted } }) });
    return ws;
  }
  function note(ws, r, text, lastCol) {
    ws.mergeCells(r, 1, r, lastCol);
    Object.assign(ws.getCell(r, 1), { value: text, font: F({ italic: true, color: { argb: C.muted } }), alignment: { wrapText: true, vertical: 'top' } });
  }
  function header(ws, r, labels, startCol = 1) {
    const row = ws.getRow(r);
    labels.forEach((l, i) => Object.assign(row.getCell(startCol + i), {
      value: l, font: F({ bold: true, color: { argb: 'FFFFFFFF' } }), fill: fill(C.accent), border: BORDER,
      alignment: { vertical: 'middle', horizontal: 'center', wrapText: true } }));
    row.height = 30;
  }
  function bodyRow(ws, r, values, fmts, zebra, startCol = 1) {
    const row = ws.getRow(r);
    values.forEach((v, i) => {
      const c = row.getCell(startCol + i);
      c.value = v;
      c.font = F();
      c.border = BORDER;
      const fmt = fmts[i];
      c.alignment = { vertical: 'top', wrapText: true, horizontal: fmt === 'c' ? 'center' : (fmt && fmt !== 'text') ? 'right' : 'left' };
      if (fmt && fmt !== 'text' && fmt !== 'c') c.numFmt = fmt;
      if (zebra) c.fill = fill(C.zebra);
    });
    return row;
  }
  function totalRow(ws, r, values, fmts, startCol = 1) {
    const row = bodyRow(ws, r, values, fmts, false, startCol);
    row.eachCell(c => { c.font = F({ bold: true }); c.fill = fill(C.total); });
    row.height = 22;
    return row;
  }
  function section(ws, r, text, lastCol) {
    ws.mergeCells(r, 1, r, lastCol);
    const c = ws.getCell(r, 1);
    Object.assign(c, { value: text, font: F({ bold: true, size: 11, color: { argb: C.accent } }), border: { bottom: { style: 'medium', color: { argb: C.accent } } } });
    ws.getRow(r).height = 22;
  }

  /* ---------- Sheet 2: Chi phí chi tiết (built first to know row numbers) ---------- */
  const expName = 'Chi phí chi tiết';
  const ex = [...d.expenses].sort((a, b) => a.date.localeCompare(b.date) || String(a.created_at || '').localeCompare(String(b.created_at || '')));
  const withImg = !!d.images;
  const maxImg = withImg ? Math.max(0, ...ex.map(e => (e.evidence || []).length)) : 0;
  const expHead = ['STT', 'Ngày chi', 'Phân loại', 'Mục đích sử dụng', 'Chi tiết', 'Mã giao hàng', 'Mã đơn chuyển', 'Mã đơn bán', 'Số tiền (VNĐ)'];
  const expW = [6, 13, 20, 30, 40, 15, 15, 15, 16];
  if (withImg) for (let i = 0; i < Math.max(1, maxImg); i++) { expHead.push(`Ảnh ${i + 1}`); expW.push(15); }
  else { expHead.push('Số ảnh'); expW.push(9); }
  const wsE = sheet(expName, expW, true, 5);
  note(wsE, 3, `Quỹ đầu tháng: ${new Intl.NumberFormat('vi-VN').format(d.budget)} đ · ${ex.length} khoản chi trong tháng`, expHead.length);
  header(wsE, 5, expHead);
  const e0 = 6;
  ex.forEach((e, i) => {
    const r = e0 + i;
    const vals = [i + 1, serial(e.date), catOf(e), e.purpose, e.detail, e.invoice, e.transfer_code, e.sales_order_code, Number(e.amount)];
    const fmts = ['c', DATE, 'text', 'text', 'text', 'text', 'text', 'text', MONEY];
    if (!withImg) { vals.push((e.evidence || []).length || ''); fmts.push('c'); }
    else for (let k = 0; k < Math.max(1, maxImg); k++) { vals.push(''); fmts.push('text'); }
    bodyRow(wsE, r, vals, fmts, i % 2 === 1);
    if (withImg && (e.evidence || []).length) {
      wsE.getRow(r).height = 62;
      e.evidence.forEach((ev, k) => {
        const img = d.images[ev.path];
        if (!img) return;
        const id = wb.addImage({ base64: img.base64, extension: 'jpeg' });
        const s = Math.min(98 / img.w, 76 / img.h);
        wsE.addImage(id, { tl: { col: 9 + k + 0.06, row: r - 1 + 0.06 }, ext: { width: Math.round(img.w * s), height: Math.round(img.h * s) }, editAs: 'oneCell' });
      });
    }
  });
  if (!ex.length) { wsE.mergeCells(e0, 1, e0, expHead.length); Object.assign(wsE.getCell(e0, 1), { value: 'Không có khoản chi nào trong tháng này.', font: F({ italic: true, color: { argb: C.muted } }), alignment: { horizontal: 'center' } }); }
  const eLast = Math.max(e0, e0 + ex.length - 1);
  const eTot = eLast + 1;
  const spent = sum(ex, e => Number(e.amount));
  wsE.mergeCells(eTot, 1, eTot, 8);
  totalRow(wsE, eTot, ['Tổng cộng', '', '', '', '', '', '', '', { formula: `SUM(I${e0}:I${eLast})`, result: spent }], ['text', 0, 0, 0, 0, 0, 0, 0, MONEY]);
  if (ex.length) wsE.autoFilter = { from: { row: 5, column: 1 }, to: { row: eLast, column: expHead.length } };
  // Breakdown by category (formulas)
  const bStart = eTot + 2;
  section(wsE, bStart, 'Tổng hợp theo phân loại', 9);
  header(wsE, bStart + 1, ['Phân loại', 'Số khoản', 'Số tiền (VNĐ)'], 3);
  const catRow = {};
  EXP_CATS.forEach((c, i) => {
    const r = bStart + 2 + i; catRow[c] = r;
    const list = ex.filter(e => catOf(e) === c);
    bodyRow(wsE, r, [c, { formula: `COUNTIF($C$${e0}:$C$${eLast},C${r})`, result: list.length }, { formula: `SUMIF($C$${e0}:$C$${eLast},C${r},$I$${e0}:$I$${eLast})`, result: sum(list, e => Number(e.amount)) }], ['text', INT, MONEY], i % 2 === 1, 3);
  });
  const cTot = bStart + 2 + EXP_CATS.length;
  totalRow(wsE, cTot, ['Tổng', { formula: `SUM(D${bStart + 2}:D${cTot - 1})`, result: ex.length }, { formula: `SUM(E${bStart + 2}:E${cTot - 1})`, result: spent }], ['text', INT, MONEY], 3);

  /* ---------- Sheet 3: Đan vợt & lương KPI ---------- */
  const strName = 'Đan vợt & lương KPI';
  const emps = d.settings.employees;
  const kpi = d.settings.kpi_target, low = d.settings.rate_low, high = d.settings.rate_high;
  const nDays = new Date(+yy, +mm, 0).getDate();
  const days = Array.from({ length: nDays }, (_, i) => `${d.month}-${String(i + 1).padStart(2, '0')}`);
  const byDate = Object.fromEntries(d.strings.map(s => [String(s.date).slice(0, 10), s.counts || {}]));
  const nE = emps.length, totCol = col(nE + 2);
  const wsS = sheet(strName, [15, ...emps.map(() => 13), 13], false, 5, 1);
  note(wsS, 3, `KPI cả shop: ${kpi} cây/tháng · Dưới KPI: ${new Intl.NumberFormat('vi-VN').format(low)} đ/cây · Đạt KPI: ${new Intl.NumberFormat('vi-VN').format(high)} đ/cây (áp dụng cho toàn bộ số vợt trong tháng)`, nE + 2);
  wsS.getRow(3).height = 30;
  header(wsS, 5, ['Ngày', ...emps, 'Tổng']);
  const s0 = 6;
  days.forEach((day, i) => {
    const r = s0 + i, counts = emps.map(n => Number(byDate[day]?.[n] || 0));
    const dow = new Date(Date.UTC(+yy, +mm - 1, i + 1)).getUTCDay();
    bodyRow(wsS, r, [serial(day), ...counts.map(v => v || 0), { formula: nE ? `SUM(B${r}:${col(nE + 1)}${r})` : '0', result: sum(counts, v => v) }], [DATE, ...emps.map(() => INT), INT], i % 2 === 1);
    if (dow === 0) wsS.getCell(r, 1).font = F({ color: { argb: C.neg } });
  });
  const sLast = s0 + nDays - 1, sTot = sLast + 1;
  const perEmp = emps.map(n => sum(days, dd => Number(byDate[dd]?.[n] || 0)));
  const racks = sum(perEmp, v => v);
  totalRow(wsS, sTot, ['Tổng cộng', ...emps.map((_, i) => ({ formula: `SUM(${col(i + 2)}${s0}:${col(i + 2)}${sLast})`, result: perEmp[i] })), { formula: `SUM(${totCol}${s0}:${totCol}${sLast})`, result: racks }], ['text', ...emps.map(() => INT), INT]);
  const achieved = racks >= kpi, rate = achieved ? high : low;
  const p0 = sTot + 2;
  delete wsS.pageSetup.printTitlesRow;
  wsS.getRow(sTot + 1).addPageBreak();
  section(wsS, p0, 'Lương đan vợt theo KPI', Math.max(4, nE + 2));
  const kpiR = p0 + 1, lowR = p0 + 2, highR = p0 + 3, totR = p0 + 4, rateR = p0 + 5, stR = p0 + 6;
  bodyRow(wsS, kpiR, ['KPI (cây/tháng)', kpi], ['text', INT]);
  bodyRow(wsS, lowR, ['Đơn giá dưới KPI', low], ['text', MONEY]);
  bodyRow(wsS, highR, ['Đơn giá đạt KPI', high], ['text', MONEY]);
  bodyRow(wsS, totR, ['Tổng vợt tháng', { formula: `${totCol}${sTot}`, result: racks }], ['text', INT]);
  bodyRow(wsS, rateR, ['Đơn giá áp dụng', { formula: `IF(B${totR}>=B${kpiR},B${highR},B${lowR})`, result: rate }], ['text', MONEY]);
  bodyRow(wsS, stR, ['Trạng thái', { formula: `IF(B${totR}>=B${kpiR},"Đạt KPI","Chưa đạt – còn "&TEXT(B${kpiR}-B${totR},"0")&" cây")`, result: achieved ? 'Đạt KPI' : `Chưa đạt – còn ${kpi - racks} cây` }], ['text', 'text']);
  [kpiR, lowR, highR, totR, rateR, stR].forEach(r => { wsS.getCell(r, 1).font = F({ bold: true }); });
  [kpiR, lowR, highR].forEach(r => { wsS.getCell(r, 3).value = 'Lấy từ Cài đặt của sổ'; wsS.getCell(r, 3).font = F({ italic: true, color: { argb: C.muted } }); });
  const ph = stR + 2;
  header(wsS, ph, ['Nhân viên', 'Số vợt', 'Đơn giá (VNĐ)', 'Tiền công (VNĐ)']);
  emps.forEach((n, i) => {
    const r = ph + 1 + i;
    bodyRow(wsS, r, [n, { formula: `${col(i + 2)}${sTot}`, result: perEmp[i] }, { formula: `$B$${rateR}`, result: rate }, { formula: `B${r}*C${r}`, result: perEmp[i] * rate }], ['text', INT, MONEY, MONEY], i % 2 === 1);
  });
  const pTot = ph + 1 + nE;
  totalRow(wsS, pTot, ['Tổng tiền công', { formula: nE ? `SUM(B${ph + 1}:B${pTot - 1})` : '0', result: racks }, '', { formula: nE ? `SUM(D${ph + 1}:D${pTot - 1})` : '0', result: racks * rate }], ['text', INT, 'text', MONEY]);
  // widen columns used by the payroll block when there are few employees
  [1, 2, 3, 4].forEach(c => { const w = wsS.getColumn(c).width || 10; wsS.getColumn(c).width = Math.max(w, c === 1 ? 18 : 16); });

  /* ---------- Sheet 4: Tiền cọc ---------- */
  const depName = 'Tiền cọc';
  const deps = [...d.deposits].sort((a, b) => a.date.localeCompare(b.date));
  const depHead = ['STT', 'Tên khách hàng', 'Số điện thoại', 'Nền tảng', 'Tài khoản / đường dẫn', 'Loại sản phẩm', 'Tên / mã sản phẩm', 'Size / màu / phiên bản', 'SL', 'Ngày cọc', 'Số tiền cọc (VNĐ)', 'Số ngày chờ', 'Trạng thái', 'Ngày hoàn tất', 'Ghi chú'];
  const wsD = sheet(depName, [6, 22, 14, 16, 26, 13, 26, 18, 6, 12, 16, 10, 13, 13, 30], true, 5);
  note(wsD, 3, 'Phạm vi: toàn bộ cọc đang chờ (mọi tháng) + cọc nhận hoặc hoàn tất trong tháng. Số ngày chờ tự cập nhật theo ngày mở file với cọc đang chờ.', depHead.length);
  header(wsD, 5, depHead);
  const d0 = 6;
  deps.forEach((x, i) => {
    const r = d0 + i;
    const end = x.closed_date || d.today;
    const wait = Math.max(0, Math.round((Date.parse(end) - Date.parse(x.date)) / 86400000));
    bodyRow(wsD, r, [i + 1, x.customer, x.phone, x.contact_platform, x.contact_handle, x.category, x.product, x.variant, Number(x.quantity), serial(x.date), Number(x.amount),
      { formula: `MAX(0,IF(N${r}="",TODAY(),N${r})-J${r})`, result: wait }, x.status, x.closed_date ? serial(x.closed_date) : '', x.note],
      ['c', 'text', 'text', 'text', 'text', 'text', 'text', 'text', INT, DATE, MONEY, INT, 'c', DATE, 'text'], i % 2 === 1);
    if (x.status === 'Đang chờ') { const c = wsD.getCell(r, 13); c.fill = fill(C.warn); c.font = F({ bold: true, color: { argb: C.warnInk } }); }
  });
  if (!deps.length) { wsD.mergeCells(d0, 1, d0, depHead.length); Object.assign(wsD.getCell(d0, 1), { value: 'Không có khách đặt cọc trong phạm vi này.', font: F({ italic: true, color: { argb: C.muted } }), alignment: { horizontal: 'center' } }); }
  const dLast = Math.max(d0, d0 + deps.length - 1), dTot = dLast + 1;
  wsD.mergeCells(dTot, 1, dTot, 10);
  totalRow(wsD, dTot, ['Tổng tiền cọc trong bảng', '', '', '', '', '', '', '', '', '', { formula: `SUM(K${d0}:K${dLast})`, result: sum(deps, x => Number(x.amount)) }], ['text', 0, 0, 0, 0, 0, 0, 0, 0, 0, MONEY]);
  if (deps.length) wsD.autoFilter = { from: { row: 5, column: 1 }, to: { row: dLast, column: depHead.length } };

  /* ---------- Sheet 1: Tổng quan tháng ---------- */
  const wsO = sheet('Tổng quan tháng', [36, 20, 44], false, 0);
  const pending = deps.filter(x => x.status === 'Đang chờ');
  const recv = deps.filter(x => x.date.startsWith(d.month));
  const E = q(expName), Sx = q(strName), D = q(depName);
  const catSum = c => sum(ex.filter(e => catOf(e) === c), e => Number(e.amount));
  const internal = sum(ex.filter(e => INTERNAL.includes(catOf(e))), e => Number(e.amount));
  let r = 4;
  const kvHead = (t) => { section(wsO, r, t, 3); r++; header(wsO, r, ['Chỉ tiêu', 'Giá trị', 'Ghi chú']); wsO.getRow(r).height = 22; r++; };
  const kv = (label, value, fmt, noteTxt, bold) => {
    const row = bodyRow(wsO, r, [label, value, noteTxt || ''], ['text', fmt, 'text'], false);
    if (bold) row.eachCell(c => { c.font = F({ bold: true }); c.fill = fill(C.total); });
    return r++;
  };
  kvHead('Quỹ chi');
  const rBudget = kv('Quỹ đầu tháng', Number(d.budget), MONEY, d.budget ? '' : 'Chưa nhập quỹ tháng');
  const rSpent = kv('Tổng đã chi', { formula: `${E}!I${eTot}`, result: spent }, MONEY, `${ex.length} khoản chi`);
  const rRemain = kv('Còn lại', { formula: `B${rBudget}-B${rSpent}`, result: d.budget - spent }, MONEY, d.budget - spent < 0 ? 'Đã vượt quỹ' : '', true);
  kv('Chi theo đơn hàng', { formula: `${E}!E${catRow['Chi theo đơn hàng']}`, result: catSum('Chi theo đơn hàng') }, MONEY, `${ex.filter(e => catOf(e) === 'Chi theo đơn hàng').length} hóa đơn`);
  kv('Chi nội bộ (dụng cụ, xăng, khác)', { formula: INTERNAL.map(c => `${E}!E${catRow[c]}`).join('+'), result: internal }, MONEY, '');
  kv('Chưa phân loại', { formula: `${E}!E${catRow['Chưa phân loại']}`, result: catSum('Chưa phân loại') }, MONEY, catSum('Chưa phân loại') ? 'Cần phân loại lại' : '');
  r++;
  kvHead('Đan vợt & lương KPI');
  kv('Tổng vợt đan trong tháng', { formula: `${Sx}!${totCol}${sTot}`, result: racks }, INT, `KPI ${kpi} cây/tháng`);
  kv('Trạng thái KPI', { formula: `${Sx}!B${stR}`, result: achieved ? 'Đạt KPI' : `Chưa đạt – còn ${kpi - racks} cây` }, 'text', '');
  kv('Đơn giá áp dụng', { formula: `${Sx}!B${rateR}`, result: rate }, MONEY, 'VNĐ/cây');
  kv('Tổng tiền công đan vợt', { formula: `${Sx}!D${pTot}`, result: racks * rate }, MONEY, 'Chưa trừ vào quỹ chi', true);
  r++;
  kvHead('Tiền cọc');
  kv('Cọc đang giữ (mọi tháng)', { formula: `SUMIF(${D}!M${d0}:M${dLast},"Đang chờ",${D}!K${d0}:K${dLast})`, result: sum(pending, x => Number(x.amount)) }, MONEY, `${pending.length} khách đang chờ`, true);
  kv('Cọc nhận trong tháng', sum(recv, x => Number(x.amount)), MONEY, `${recv.length} lượt nhận cọc`);
  kv('Tiền cọc theo dõi riêng', '', 'text', 'Không cộng vào quỹ chi');
  wsO.getCell(rRemain, 2).font = F({ bold: true, color: { argb: d.budget - spent < 0 ? C.neg : C.accent } });
  // put overview first
  [wsO, wsE, wsS, wsD].forEach((w, i) => { w.orderNo = i; });
  wb.views = [{ x: 0, y: 0, width: 20000, height: 12000, firstSheet: 0, activeTab: 0, visibility: 'visible' }];
  return wb;
}
/* Pure parser: OCR text of chat / bank-transfer screenshots -> deposit form values. Unknown fields are left out, never guessed. */
// shortcut: regex tuned on Zalo screenshots, misses "1tr2"-style amounts and other apps' layouts; move to a vision model if staff correct more fields than they keep.
function parseDepositText(text, today) {
  const o = {}, m = (re, s = text) => ((s.match(re) || [])[1] || '').trim();
  const title = text.split('\n').find(l => /\p{L}/u.test(l) && !/^\s*\d{1,2}:\d{2}/.test(l)) || '';
  o.customer = m(/Tên\s*:\s*([^\n]+)/i) || m(/^[^\p{L}]*((?:\p{Lu}\p{L}*\s?){1,5})/u, title);
  o.phone = m(/(?<!\d)(0\d{9})(?!\d)/);
  const money = text.match(/cọc\D{0,3}(\d[\d.,]*)\s*(k|tr)?/i) || text.match(/(\d[\d.,]*)\s*(k|tr)\s*cọc/i) || text.match(/(?<![\d\/.,])(\d{1,3}(?:[.,]\d{3})+)(?![\d\/k])/);

function codes(e) {
  const list = [['Giao hàng', e.invoice], ['Chuyển', e.transfer_code], ['Bán', e.sales_order_code]].filter(x => x[1]);
  return list.length ? `<div class="codes">${list.map(([l, v]) => `<div><span class="muted">${l}</span> <span class="code">${esc(v)}</span></div>`).join('')}</div>` : '<span class="muted">—</span>';
}
const waitDays = x => Math.max(0, Math.round((Date.parse(x.closed_date || today()) - Date.parse(x.date)) / 86400000));
function thumbs(e) {
  const ev = e.evidence || [];
  if (!ev.length) return '<span class="muted">—</span>';
  const first = ev[0], more = ev.length - 1;
  return `<div class="thumbs"><button data-act="gallery" data-id="${e.id}" data-i="0" aria-label="Xem ${ev.length} ảnh của ${esc(e.purpose)}">${S.urls[first.path] ? `<img src="${esc(S.urls[first.path])}" alt="" loading="lazy">` : ic('image')}</button>${more ? `<button class="more" data-act="gallery" data-id="${e.id}" data-i="1" aria-label="Xem ảnh tiếp theo của ${esc(e.purpose)}">+${more}</button>` : ''}</div>`;
}

/* ---------- dialogs ---------- */
let lastFocus = null;
function openDialog(id, html) {
  lastFocus = document.activeElement;
  const d = $('#' + id); d.innerHTML = html; d.showModal();
  const first = d.querySelector('[autofocus],input:not([type=hidden]):not([disabled]),select,textarea');
  if (first) first.focus();
}
function closeDialog(id) { const d = $('#' + id); if (d.open) d.close(); }
['sheet', 'modal', 'gallery'].forEach(id => {
  const d = document.getElementById(id);
  d.addEventListener('close', () => { d.innerHTML = ''; if (id === 'sheet') { pendingPhotos.forEach(p => URL.revokeObjectURL(p.url)); pendingPhotos = []; } if (lastFocus?.isConnected) lastFocus.focus(); });
  d.addEventListener('click', e => { if (e.target === d && id !== 'sheet') d.close(); });
});
const field = (label, input, opts = {}) => `<label class="field"><span>${label}${opts.req ? ' <em aria-hidden="true">*</em>' : ''}</span>${input}${opts.hint ? `<small>${opts.hint}</small>` : ''}<span class="err" data-err="${opts.name || ''}" hidden></span></label>`;
const sheetShell = (title, desc, body, submit) => `<form method="dialog" id="sheet-form" novalidate>
  <div class="dh"><div><h2 id="sheet-title">${title}</h2><p>${desc}</p></div><button type="button" class="icon-btn" data-act="close-sheet" aria-label="Đóng">${ic('x')}</button></div>
  <div class="db"><div class="form-err" id="sheet-err" role="alert" hidden></div>${body}</div>
  <div class="df"><button type="button" class="btn" data-act="close-sheet">Hủy</button><button type="submit" class="btn primary" id="sheet-submit">${submit}</button></div></form>`;
function confirmBox(title, text, verb, onYes) {
  openDialog('modal', `<div class="card-b" style="padding:24px"><h2 id="modal-title">${title}</h2><p class="muted" style="margin:8px 0 20px">${text}</p>
  <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" data-act="close-modal" autofocus>Hủy</button><button class="btn danger" id="confirm-yes">${verb}</button></div></div>`);
  $('#confirm-yes').onclick = async () => { const b = $('#confirm-yes'); b.disabled = true; b.textContent = 'Đang xử lý…'; try { await onYes(); closeDialog('modal'); } catch (e) { b.disabled = false; b.textContent = verb; toast(friendly(e)); } };
}
function showErrors(form, errs) {
  form.querySelectorAll('[data-err]').forEach(el => { el.hidden = true; el.textContent = ''; });
  form.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));

const svPending = {};
function setCount(d, n, v) {

  if (!rec) { rec = { date: d, counts: {} }; S.strings.push(rec); }
  rec.counts = { ...rec.counts, [n]: v };
  clearTimeout(svPending[d].t);
  svPending[d].t = setTimeout(() => saveDay(d), 600);

}
async function saveDay(d) {

}

  $('#gallery').innerHTML = `<div class="gal"><div class="gal-top"><span>${esc(gal.title)} · ảnh ${gal.i + 1}/${gal.list.length}</span>${url ? `<a class="icon-btn" href="${esc(url)}" target="_blank" rel="noopener" aria-label="Mở ảnh gốc" title="Mở ảnh gốc">${ic('download')}</a>` : ''}<button class="icon-btn" data-act="gal-close" aria-label="Đóng" autofocus>${ic('x')}</button></div>
  <div class="gal-body">${many ? `<button class="icon-btn" data-act="gal-step" data-k="-1" aria-label="Ảnh trước">${ic('left')}</button>` : ''}${url ? `<img src="${esc(url)}" alt="Ảnh bằng chứng ${gal.i + 1}">` : '<p>Đang tải ảnh…</p>'}${many ? `<button class="icon-btn" data-act="gal-step" data-k="1" aria-label="Ảnh sau">${ic('right')}</button>` : ''}</div></div>`;
}

/* Excel export */
let excelLoading = null;
function loadExcel() {
  if (window.ExcelJS) return Promise.resolve();
  return excelLoading ||= new Promise((ok, no) => { const s = document.createElement('script'); s.src = EXCELJS_URL; s.onload = ok; s.onerror = () => { excelLoading = null; no(new Error('Không tải được bộ tạo Excel. Kiểm tra mạng rồi thử lại.')); }; document.head.appendChild(s); });
}
async function exportExcel() {
  if (S.exporting) return;
  S.exporting = true; render();
  try {
    await loadExcel();
    let images = null;
    if (S.withImages && S.expenses.some(e => (e.evidence || []).length)) {
      await signUrls();
      images = {};
      for (const e of S.expenses) for (const p of e.evidence || []) {
        const url = S.urls[p.path]; if (!url) throw new Error(`Không tải được ảnh của khoản chi ngày ${dmy(e.date)}. Bỏ chọn kèm ảnh hoặc thử lại.`);
        const r = await fetch(url); if (!r.ok) throw new Error(`Không tải được ảnh của khoản chi ngày ${dmy(e.date)}. Bỏ chọn kèm ảnh hoặc thử lại.`);
        const { blob, w, h } = await toJpeg(await r.blob(), 480, 0.8);
        const base64 = await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(blob); });
        images[p.path] = { base64, w, h };
      }
    }
    const wb = buildWorkbook(window.ExcelJS, { month: S.month, today: today(), settings: S.settings, budget: S.budget, expenses: S.expenses, strings: S.strings, deposits: S.deposits, images });
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = `So_Shop_Q3_${S.month}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Đã tạo file Excel');
  } catch (e) { toast(friendly(e)); }
  finally { S.exporting = false; render(); }
}

/* ---------- events ---------- */
function go(view) { flushCounts(); if (!VIEWS[view]) view = 'overview'; S.view = view; $('#side')?.classList.remove('open'); $('#scrim')?.classList.remove('open'); render(); if (view === 'settings') loadMembers(); $('#main')?.focus({ preventScroll: true }); window.scrollTo(0, 0); }
async function loadMembers() { try { S.members = must(await sb.from('members').select('email').order('email')); if (S.view === 'settings') render(); } catch {} }
window.addEventListener('hashchange', () => go(location.hash.slice(1)));

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const run = async fn => { try { await fn(); } catch (e) { toast(friendly(e)); } };
  switch (act) {
    case 'open-nav': $('#side').classList.add('open'); $('#scrim').classList.add('open'); $('#side a')?.focus(); break;
    case 'close-nav': $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); break;
    case 'go': location.hash = el.dataset.view; break;
    case 'month': { const m = shiftMonth(S.month, +el.dataset.k); if (m > today().slice(0, 7)) return; S.month = m; loadMonth(m); break; }
    case 'reload': loadMonth(S.month); break;
    case 'logout': Object.keys(localStorage).filter(k => k.startsWith('soshop:')).forEach(k => { try { localStorage.removeItem(k); } catch {} }); await sb.auth.signOut(); break;
    case 'expense-new': expenseForm(); break;
    case 'expense-edit': expenseForm(S.expenses.find(x => x.id === id)); break;
    case 'expense-del': { const e = S.expenses.find(x => x.id === id); confirmBox('Xóa khoản chi?', `Xóa “${esc(e.purpose)}” (${money(e.amount)}, ${dmy(e.date)}) cùng ${(e.evidence || []).length} ảnh. Không thể hoàn tác.`, 'Xóa khoản chi', async () => {
      must(await sb.from('expenses').delete().eq('id', id));
      if ((e.evidence || []).length) sb.storage.from('evidence').remove(e.evidence.map(x => x.path));
      S.expenses = S.expenses.filter(x => x.id !== id); cacheNow(); render(); toast('Đã xóa khoản chi'); }); break; }
    case 'deposit-new': depositForm(); break;
    case 'deposit-edit': depositForm(S.deposits.find(x => x.id === id)); break;
    case 'deposit-del': { const x = S.deposits.find(d => d.id === id); confirmBox('Xóa khách đặt cọc?', `Xóa cọc của “${esc(x.customer)}” (${money(x.amount)}). Không thể hoàn tác.`, 'Xóa khách cọc', async () => {
      must(await sb.from('deposits').delete().eq('id', id)); S.deposits = S.deposits.filter(d => d.id !== id); cacheNow(); render(); toast('Đã xóa khách cọc'); }); break; }
    case 'close-sheet': closeDialog('sheet'); break;
    case 'close-modal': closeDialog('modal'); break;
    case 'budget-edit': S.editBudget = true; render(); $('#budget-tile')?.focus(); break;
    case 'budget-cancel': S.editBudget = false; render(); break;
    case 'photo-rm': (el.dataset.kind === 'kept' ? keptPhotos : pendingPhotos).splice(+el.dataset.i, 1); renderPhotos(); break;
    case 'gallery': openGallery(S.expenses.find(x => x.id === id), +el.dataset.i); break;
    case 'gal-close': closeDialog('gallery'); break;
    case 'gal-step': gal.i = (gal.i + +el.dataset.k + gal.list.length) % gal.list.length; drawGallery(); $('#gallery [data-act="gal-step"][data-k="' + el.dataset.k + '"]')?.focus(); break;
    case 'clear-exp': S.f.expQ = ''; S.f.expCat = 'all'; render(); break;
    case 'clear-dep': S.f.depQ = ''; S.f.depStatus = 'all'; render(); break;
    case 'export': exportExcel(); break;
    case 'toggle-img': S.withImages = el.checked; break;
    case 'sv-mode': flushCounts(); S.sv.mode = el.dataset.mode; render(); break;
    case 'sv-who': flushCounts(); S.sv.who = el.dataset.name; render(); window.scrollTo(0, 0); break;
    case 'sv-day': flushCounts(); S.sv.day = el.dataset.day; render(); window.scrollTo(0, 0); break;
    case 'sv-go': svShift(+el.dataset.k, el.dataset.focus); break;
    case 'sv-step': { const d = el.dataset.svDate, n = el.dataset.emp, v = setCount(d, n, countOf(d, n) + +el.dataset.svStep);
      const inp = document.querySelector(`.sv-in[data-sv-date="${d}"][data-emp="${CSS.escape(n)}"]`); if (inp) { inp.value = v || ''; inp.removeAttribute('aria-invalid'); } svRefresh(); break; }
    case 'emp-del': { const n = el.dataset.name; confirmBox('Xóa nhân viên?', `Ẩn cột “${esc(n)}” khỏi bảng đan vợt. Số vợt đã ghi vẫn được giữ trong dữ liệu.`, 'Xóa nhân viên', async () => { await saveSettings({ employees: S.settings.employees.filter(x => x !== n) }); toast('Đã xóa nhân viên'); }); break; }
    case 'mem-del': { const m = el.dataset.email; confirmBox('Gỡ quyền dùng sổ?', `${esc(m)} sẽ không xem hoặc sửa được sổ nữa.`, 'Gỡ quyền', async () => { must(await sb.from('members').delete().eq('email', m)); await loadMembers(); toast('Đã gỡ quyền'); }); break; }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches?.('.sv-in')) {
    ev.preventDefault();
    const t = ev.target, emps = S.settings.employees;
    if (S.sv.mode === 'emp') { const ds = svDates(), next = ds[ds.indexOf(t.dataset.svDate) + 1]; next ? svFocus('sv-p-' + next) : t.blur(); }
    else { const i = emps.indexOf(t.dataset.emp); if (i < emps.length - 1) svFocus('sv-d-' + (i + 1)); else if (!svShift(1, true)) t.blur(); }
  }
  if (ev.key === 'Escape' && $('#side')?.classList.contains('open')) { $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); $('.top .menu')?.focus(); }
  if ($('#gallery').open && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && gal.list.length > 1) { gal.i = (gal.i + (ev.key === 'ArrowRight' ? 1 : -1) + gal.list.length) % gal.list.length; drawGallery(); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.matches('.sv-in')) {
    const raw = t.value.trim();
    if (raw !== '' && !(/^\d{1,3}$/.test(raw) && +raw <= 200)) { t.setAttribute('aria-invalid', 'true'); const st = $('#sv-status'); if (st) st.textContent = 'Số vợt phải là số nguyên từ 0 đến 200.'; return; }
    t.removeAttribute('aria-invalid'); setCount(t.dataset.svDate, t.dataset.emp, raw); svRefresh(); return;
  }
  if (t.dataset.f) { S.f[t.dataset.f] = t.value; render(); }
  if (t.closest('.field') && t.getAttribute('aria-invalid')) { t.removeAttribute('aria-invalid'); const err = t.closest('.field').querySelector('.err'); if (err) err.hidden = true; }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'month-input' && t.value) { const m = t.value > today().slice(0, 7) ? today().slice(0, 7) : t.value; S.month = m; loadMonth(m); }
  if (t.dataset.act === 'photo-add') addPhotos([...t.files]);
  if (t.dataset.act === 'dep-ocr') fillDepositFromImages(t, [...t.files]);
  if (t.dataset.act === 'dep-status') { const c = t.form.elements.closed_date; c.disabled = t.value === 'Đang chờ'; if (!c.disabled && !c.value) c.value = today(); }
});
document.addEventListener('focusin', ev => { if (ev.target.matches?.('.sv-in')) ev.target.select(); });
document.addEventListener('focusout', ev => {
  const t = ev.target, wrap = t.closest?.('#sheet-form .field'); if (!wrap || !t.name) return;
  const err = wrap.querySelector('.err'); if (!err) return;
  const label = wrap.querySelector('span')?.firstChild?.textContent.trim().toLowerCase() || 'trường này';
  let msg = '';
  if (t.required && !t.value.trim()) msg = `Cần nhập ${label}.`;
  else if (t.type === 'number' && t.value !== '' && t.min !== '' && Number(t.value) < Number(t.min)) msg = `Nhập số từ ${t.min} trở lên.`;
  else if (t.type === 'date' && t.max && t.value > t.max) msg = 'Ngày không được nằm trong tương lai.';
  err.hidden = !msg; err.textContent = msg;
  msg ? t.setAttribute('aria-invalid', 'true') : t.removeAttribute('aria-invalid');
});
document.addEventListener('paste', ev => {
  const ocr = $('[data-act="dep-ocr"]');
  if (!$('#sheet').open || (!$('#photos') && !ocr)) return;
  const files = [...(ev.clipboardData?.items || [])].filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
  if (!files.length) return;
  ev.preventDefault();
  ocr ? fillDepositFromImages(ocr, files) : addPhotos(files);
});
document.addEventListener('submit', async ev => {
  const form = ev.target; ev.preventDefault();
  const btn = form.querySelector('[type=submit]') || $('#sheet-submit');
  const busy = (on, label) => { if (!btn) return; btn.disabled = on; if (on) { btn.dataset.l = btn.innerHTML; btn.textContent = label || 'Đang lưu…'; } else if (btn.dataset.l) btn.innerHTML = btn.dataset.l; };
  const fail = e => { const box = form.querySelector('#sheet-err'); if (box) { box.hidden = false; box.textContent = friendly(e); } else toast(friendly(e)); };
  if (form.id === 'login') {
    const f = Object.fromEntries(new FormData(form));
    if (!f.email || !f.password) return renderLogin('Nhập email và mật khẩu.', f.email);
    busy(true, 'Đang đăng nhập…');
    const { error } = await sb.auth.signInWithPassword({ email: f.email.trim(), password: f.password });
    if (error) renderLogin(/invalid/i.test(error.message) ? 'Email hoặc mật khẩu không đúng.' : friendly(error), f.email);
    return;
  }
  if (form.id === 'sheet-form') {
    busy(true);
    try { if ($('#photos')) await saveExpense(form); else await saveDeposit(form); } catch (e) { fail(e); } finally { if (btn.isConnected) busy(false); }
    return;
  }
  const f = Object.fromEntries(new FormData(form));
  try {
    if (form.dataset.form === 'budget') {
      if (!(Number(f.amount) >= 0) || f.amount === '') { toast('Nhập số tiền quỹ.'); form.elements.amount.focus(); return; }
      busy(true); await saveBudget(Number(f.amount));
    } else if (form.dataset.form === 'kpi') {
      const k = Math.round(+f.kpi_target), lo = Math.round(+f.rate_low), hi = Math.round(+f.rate_high);
      if (!(k > 0 && lo >= 0 && hi >= 0)) return toast('KPI phải lớn hơn 0, đơn giá không âm.');
      busy(true); await saveSettings({ kpi_target: k, rate_low: lo, rate_high: hi }); toast('Đã lưu KPI');
    } else if (form.dataset.form === 'emp') {
      const n = f.name.trim(); if (!n) return toast('Nhập tên nhân viên.');
      if (S.settings.employees.some(x => fold(x) === fold(n))) return toast('Nhân viên này đã có trong danh sách.');
      busy(true); await saveSettings({ employees: [...S.settings.employees, n] }); toast('Đã thêm nhân viên');
    } else if (form.dataset.form === 'mem') {
      const m = f.email.trim().toLowerCase(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) return toast('Email chưa đúng định dạng.');
      busy(true); must(await sb.from('members').upsert({ email: m })); await loadMembers(); toast('Đã cấp quyền cho ' + m);
    }
  } catch (e) { fail(e); } finally { if (btn?.isConnected) busy(false); }
});

/* ---------- boot ---------- */
async function onSession(session) {
  const had = S.session?.user?.id;
  S.session = session || false;
  if (!session) { S.member = null; S.loaded = false; render(); return; }
  if (had === session.user.id && S.member) return;
  if (store.get('soshop:member') === session.user.id) S.member = true;
  S.view = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'overview';
  if (S.member) loadMonth(S.month);
  const { data, error } = await sb.rpc('is_member');
  if (error) { if (!S.member) { S.member = true; loadMonth(S.month); } return; }
  if (!data) { S.member = false; store.set('soshop:member', null); render(); return; }
  if (!S.member) { S.member = true; store.set('soshop:member', session.user.id); loadMonth(S.month); }
}
sb.auth.onAuthStateChange((evt, session) => { if (evt === 'TOKEN_REFRESHED') { S.session = session; return; } setTimeout(() => onSession(session), 0); });
})();
</script>
